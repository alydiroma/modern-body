{% set nodes = craft.navigation.nodes('mainNavLeft').all() %}
<nav class="header-nav header-nav-left">
    <ul class="nav-items">
        {% nav node in nodes %}
            <li class="nav-item">
                <a {% if node.url %}href="{{ node.url }}" {% endif %}
                    class="nav-link bold {% if node.active %}nav-active{% endif %}">
                    {{- node.title -}}
                </a>
            </li>
        {% endnav %}
    </ul>
</nav>
